name: medreminder
description: MedReminder Intelligent - medication reminder with drug interaction detection.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Network requests to the OpenFDA API
  http: ^1.2.0

  # Persist medications on the device
  shared_preferences: ^2.2.2

  # Format dates and times in a human-friendly way
  intl: ^0.19.0

  # Show local notifications (the medication reminders)
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Material 3 Google fonts for nicer typography
  google_fonts: ^6.2.1

  # Riverpod for state management
  flutter_riverpod: ^2.5.1

  # Google Sign-In (SSO)
  google_sign_in: ^6.2.1

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/interactions.json
